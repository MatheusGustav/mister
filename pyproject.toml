[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mister-ai"
version = "0.1.0"
description = "Assistente pessoal agêntico: um cérebro (LLM) decide, tools determinísticas executam, segurança em código."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matheus Gustav" }]
dependencies = [
    "pydantic>=2,<3",
    "rich>=13",
    # O embeddinggemma roda DENTRO do processo (item 6, 14/08/2026): sem
    # servidor, sem Ollama. onnxruntime executa o grafo (a conversão
    # ISOISS/embeddinggemma-300m-ONNX-sentencetransformers já traz as camadas
    # Dense do pooling dentro do ONNX — testado contra o Ollama, cosseno
    # cruzado ≥ 0.99); tokenizers faz o dialeto de busca virar tokens; numpy é
    # o formato que o onnxruntime espera na entrada/saída.
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# O correio (mandar/buscar arquivo entre PC e celular) é o EKODIDE — projeto
# separado, com repo, versão e ciclo próprios. Entra como EXTRA OPCIONAL de
# propósito: o Mister tem que subir e rodar sem ele instalado, e as tools do
# celular recusam com receita em vez de estourar (ver mister/tools/correio.py).
#
# >=0.1.1 e não >=0.1: o `espiar` (a espiada do olhar_no_celular, que lê sem
# gravar) nasceu na 0.1.1. Com a 0.1.0 o import passa e a tool quebra na hora
# de usar — o pior tipo de falha, a que só aparece tarde.
celular = ["ekodide>=0.1.1"]

[project.scripts]
mister = "mister.__main__:main"

[tool.setuptools.packages.find]
include = ["mister*"]
