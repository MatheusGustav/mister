[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mister-ai"
version = "0.1.0"
description = "Assistente pessoal agêntico: um cérebro (LLM) decide, tools determinísticas executam, segurança em código."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matheus Gustav" }]
dependencies = [
    "pydantic>=2,<3",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# O correio (mandar/buscar arquivo entre PC e celular) é o EKODIDE — projeto
# separado, com repo, versão e ciclo próprios. Entra como EXTRA OPCIONAL de
# propósito: o Mister tem que subir e rodar sem ele instalado, e as tools do
# celular recusam com receita em vez de estourar (ver mister/tools/correio.py).
#
# >=0.1.1 e não >=0.1: o `espiar` (a espiada do olhar_no_celular, que lê sem
# gravar) nasceu na 0.1.1. Com a 0.1.0 o import passa e a tool quebra na hora
# de usar — o pior tipo de falha, a que só aparece tarde.
celular = ["ekodide>=0.1.1"]
# A TUI de tela cheia (mister/tui.py) é extra pelo MESMO desenho do celular:
# o Mister sobe e roda sem ela (a pele simples continua sendo o `mister`), e o
# `mister-tui` sem o extra recusa com receita em vez de estourar.
tui = ["textual>=1"]

[project.scripts]
mister = "mister.__main__:main"
mister-tui = "mister.tui:main"

[tool.setuptools.packages.find]
include = ["mister*"]
